# The formatter multiplexer - https://github.com/numtide/treefmt
#
# References,
# - https://treefmt.com/latest/getting-started/configure/

walk = "git"

[formatter.nix]
command = "nixfmt"
options = ["--strict"]
includes = ["*.nix"]

[formatter.rust]
command = "rustfmt"
options = ["--config-path", ".rustfmt.toml"]
includes = ["*.rs"]

[formatter.python]
command = "ruff"
options = ["fmt"]
includes = ["*.py"]